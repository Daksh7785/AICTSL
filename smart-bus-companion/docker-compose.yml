version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: smart-bus-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["--replSet", "rs0"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.initiate() } catch(e) { rs.status() }"]
      interval: 10s
      timeout: 10s
      retries: 5

  server:
    build: ./server
    container_name: smart-bus-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart-bus?replicaSet=rs0
      - JWT_SECRET=super_secret_for_jwt
      - CLIENT_URL=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build: ./client
    container_name: smart-bus-client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongodb_data:
